name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install chromium
      - name: Unit and contract tests
        run: npm test
      - name: Browser and extension flow tests
        run: npm run test:browser

  release-contract:
    name: Reproducible release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build and verify release packages
        run: npm run release
      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-archive-${{ github.sha }}
          path: |
            release/拾光存档-v*-朋友测试版.zip
            release/拾光存档-v*-Chrome-Web-Store.zip
            release/RELEASE-MANIFEST.json
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
